name: prepare-main-once
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-main-once.yml]
permissions:
  contents: write
concurrency:
  group: ieum-main-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'orot11955/ieum'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify authorized main baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD^)" = f4ccbc233aa5c62f3310e00d483c2115f145876a
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Retrieve hash-locked documentation payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/ieum-preparation.base64"
          for sha in 70fdcae2cec97d89bd3f5826e93c725b4b7dcfbf bdf2d337e44cc6f8a1485612a0ce0155418a610a 6f71405f2be9a958c498b825d868a1ea28622f9b eb257aefe5ac232ca0ca11709bee7badb1ffd7af b4a69ec234ff3b22f02f6970f3ad79b7708d6cd9 9cc095071ad010d5e10fddae6cdcb6f7973f7fda 172e9af4d548734121dba344e91c170c84de9c81; do
            gh api "repos/orot11955/ieum/git/blobs/$sha" --jq .content | base64 --decode >> "$RUNNER_TEMP/ieum-preparation.base64"
          done
          base64 --decode "$RUNNER_TEMP/ieum-preparation.base64" > "$RUNNER_TEMP/ieum-preparation.xz"
          echo "b65f409b629cc6319758584ec86e266f03e419373a0452e1335f287de7643bb1  $RUNNER_TEMP/ieum-preparation.xz" | sha256sum --check
          xz --decompress --stdout "$RUNNER_TEMP/ieum-preparation.xz" > "$RUNNER_TEMP/ieum-preparation.json"
      - name: Apply plans and remove reviewed leftovers only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path.cwd()
          manifest = json.loads((Path(os.environ['RUNNER_TEMP'])/'ieum-preparation.json').read_text())
          assert manifest['schema'] == 1 and manifest['base_commit'] == 'f4ccbc233aa5c62f3310e00d483c2115f145876a'
          def safe(name):
              p = Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert not any((root.joinpath(*p.parts[:i])).is_symlink() for i in range(1, len(p.parts)+1))
              return root/p
          def blob(p):
              b = p.read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for name, sha in manifest['preserved'].items():
              assert blob(safe(name)) == sha, 'Preserved source changed: '+name
          for name, sha in manifest['delete'].items():
              p = safe(name)
              if name.startswith('.github/'):
                  assert not p.exists(), 'Workflow deletion must be performed by connector: '+name
                  continue
              assert p.is_file() and blob(p) == sha, 'Deletion precondition failed: '+name
              p.unlink()
          for name, text in manifest['files'].items():
              assert name in {'README.md','AGENTS.md','package.json','.gitignore'} or name.startswith(('docs/','scripts/plan/'))
              p = safe(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
          legacy = []
          for folder in ['product','architecture','design','review','adr']:
              legacy += list((root/'docs'/folder).glob('*.md'))
          legacy += [root/'design-system/README.md']
          for p in legacy:
              if p.name.startswith('0012-'):
                  continue
              text = p.read_text()
              def rewrite(m):
                  target = m.group(2)
                  if re.match(r'^[a-z][a-z0-9+.-]*:',target,re.I):
                      return m.group(0)
                  for old,new in manifest['legacy_link_map'].items():
                      target = target.replace(old,new)
                  return m.group(1)+target+m.group(3)
              text = re.sub(r'(\[[^\]\n]*\]\()([^\)\n]+)(\))',rewrite,text)
              plan = os.path.relpath(root/'docs/plan/README.md',p.parent)
              adr = os.path.relpath(root/'docs/adr/0012-main-zero-base-execution.md',p.parent)
              note = f'> 2026-09-23 기준: 보존된 세부 설계 또는 과거 검토입니다. 현재 실행 순서·런타임·작업 상태는 [단일 실행 계획]({plan})과 [ADR 0012]({adr})를 우선합니다. 옛 M/S/I 단계와 예시 명령은 현재 구현 상태를 뜻하지 않습니다. 원본·출처·권한·디자인 안전 계약은 유지하며 Paper/Dark 모두 현재 기준입니다.\n\n'
              p.write_text(note+text,encoding='utf-8')
          print('Applied',len(manifest['files']),'payload files; preserved',len(manifest['preserved']),'baseline assets.')
          PY
          node scripts/plan/render.mjs
      - name: Verify preparation without installing product dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm run design:build
          npm run design:test
          npm run design:check
          npm run plan:check
          git diff --check
      - name: Record actual evidence and preserve baseline hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP'])/'ieum-preparation.json').read_text())
          for name, sha in manifest['preserved'].items():
              b = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert actual == sha, 'Baseline altered: '+name
          run = os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          node = subprocess.check_output(['node','--version'],text=True).strip()
          text = '\n'.join([
              '# BASE-01 · 계획 채택과 소스 준비 검증', '',
              '- 상태: VERIFIED (source preparation only)',
              '- 기준 main: `'+manifest['base_commit']+'`',
              '- 검사 대상 준비 커밋: `'+os.environ['GITHUB_SHA']+'`',
              '- 실제 실행: '+run,
              '- 환경: '+platform.system()+' / Node '+node, '',
              '## 실제 통과한 검사', '',
              '`node scripts/plan/render.mjs`, `npm run design:build`, `npm run design:test`, `npm run design:check`, `npm run plan:check`, `git diff --check`.', '',
              '75개 작업의 ID·필수 계약·선행 관계·순환 의존성·최종 인수 연결·27개 화면·14개 요구사항 매핑과 로컬 문서 링크를 검사했습니다. 생성 문서와 JSON 정본의 일치를 검사했습니다.', '',
              str(len(manifest['preserved']))+'개 지정 디자인·공통 UI·테마·검사 소스의 Git blob hash가 기준선과 같습니다. 삭제는 cleanup-manifest.json의 13개 경로로 제한했습니다.', '',
              '## 수행하지 않은 범위', '',
              '제품 runtime·Core·인증·DB migration·DB 통합·React 브라우저·E2E·실제 사용자 품질은 구현/검증하지 않았습니다. 운영 DB·배포 상태는 UNKNOWN이며 조회하거나 변경하지 않았습니다. 브랜치 보호·Secrets·배포·force push를 변경하지 않았습니다.', '',
              '## 다음 작업', '',
              '별도 구현 지시를 받은 후 main에서 BASE-02부터 시작합니다. BASE-02 이후 74개 작업은 아직 PLANNED입니다.', ''
          ])
          Path('docs/evidence/base-01.md').write_text(text,encoding='utf-8')
          PY
          npm run prep:check
          git diff --check
      - name: Commit reviewed preparation to main without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ieum-build
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md package.json .gitignore docs scripts/plan
          git add -u
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'chore(plan): adopt zero-base roadmap and prepare main [BASE-01]'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          git log -1 --format='%H %s'
