name: dependency-bootstrap
on:
  push:
    branches: [feat/paper-dark-product]
    paths: [package.json, .github/workflows/dependency-bootstrap.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Resolve dependencies and retain an exact lock
        run: npm install --ignore-scripts --no-fund
      - name: Prepare the declared build tool
        run: npm rebuild esbuild
      - name: Record installed versions and audit
        run: |
          npm ls --depth=0 > dependency-versions.txt
          npm audit --json > dependency-audit.json || true
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));for(const k of ['dependencies','devDependencies'])for(const n of Object.keys(p[k]))p[k][n]=JSON.parse(fs.readFileSync('node_modules/'+n+'/package.json')).version;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit only the dependency manifest and lock to this implementation branch
        run: |
          git config user.name 'ieum-build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: pin resolved dependencies for product implementation"
            git push origin HEAD:feat/paper-dark-product
          fi
      - name: Package public source and installed dependencies for the offline development environment
        run: |
          git archive --format=tar HEAD > repo-source.tar
          tar -czf dependencies.tgz node_modules package.json package-lock.json dependency-versions.txt dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ieum-offline-development
          path: |
            dependencies.tgz
            repo-source.tar
            dependency-versions.txt
            dependency-audit.json
          retention-days: 2
          compression-level: 0
