name: product-ci
on:
  push:
    branches: [main, feat/paper-dark-product]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: ieum_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ieum_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund && npm rebuild esbuild
      - run: npm run design:build && npm run design:test && npm run design:check
      - run: npm run typecheck && npm test && npm run build
      - name: PostgreSQL integration (not an in-memory substitute)
        env:
          TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only-password@127.0.0.1:5432/ieum_test
        run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 5
