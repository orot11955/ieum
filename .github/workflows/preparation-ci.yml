name: Preparation and workspace checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparation:
    name: Plan and preserved design
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Check preparation scripts
        run: |
          node --check scripts/plan/render.mjs
          node --check scripts/plan/check.mjs
      - name: Verify preparation from a clean checkout without dependency installation
        run: npm run prep:check
      - name: Verify tracked sources remain unchanged
        run: git diff --exit-code

  workspace:
    name: Core, lab and API workspace
    needs: preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check contract generation and import boundaries
        run: pnpm contracts:check
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Build
        run: pnpm build
      - name: Run built lab smoke entry
        run: pnpm lab:smoke
      - name: Run built API and worker smoke entry
        run: pnpm api:smoke
      - name: Verify tracked sources remain unchanged
        run: git diff --exit-code

# Product auth, database, browser and end-to-end checks are added with their cards.
